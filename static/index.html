<!DOCTYPE html>
<html lang="zh" data-theme="darkroom">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾光 · 生图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="/static/assets/favicon.ico">
<link rel="icon" type="image/png" sizes="64x64" href="/static/assets/favicon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<aside class="rail">
  <header class="brand">
    <h1><span id="app-name">拾光</span><span class="lamp" aria-hidden="true"></span></h1>
    <p class="tag">本地生图工作台</p>
    <button id="open-settings" class="gear" title="设置" aria-label="设置">⚙</button>
  </header>

  <div class="field" id="need-api" hidden>
    <p class="hint">还没有配置 API，点右上角 ⚙ 填写地址和密钥。</p>
  </div>

  <div class="field">
    <label for="prompt">提示词</label>
    <textarea id="prompt" placeholder="描述你想要的画面…" spellcheck="false"></textarea>
    <div id="reference-box" class="reference-box">
      <input id="reference-input" type="file" accept="image/png,image/jpeg,image/webp" hidden>
      <button id="reference-add" class="reference-add" type="button">＋ 参考图</button>
      <div id="reference-preview" class="reference-preview" hidden>
        <img id="reference-thumb" alt="参考图缩略图">
        <span id="reference-name"></span>
        <button id="reference-clear" type="button" aria-label="清除参考图">✕</button>
      </div>
      <span id="reference-note" class="label-note">拖入或粘贴图片</span>
    </div>
  </div>

  <div class="field" id="prompt-history-field" hidden>
    <div class="ph-head">
      <label>Prompt 历史 <span class="label-note">点击回填 · ✕ 删除单条</span></label>
      <button id="ph-clear" class="ph-clear" type="button">清空</button>
    </div>
    <div id="prompt-history" class="chips"></div>
  </div>

  <div class="field">
    <label for="model">模型 <span class="label-note">可输入筛选</span></label>
    <div class="combo" id="model-combo">
      <input id="model" type="text" autocomplete="off" spellcheck="false" placeholder="加载中…">
      <button class="combo-toggle" tabindex="-1" aria-label="展开模型列表">▾</button>
      <div class="combo-list" id="model-list" hidden></div>
    </div>
  </div>

  <div id="advanced-params" class="field advanced-params" hidden>
    <label>参数 <span id="capability-label" class="label-note"></span></label>
    <div class="param-grid">
      <label id="quality-param">质量<select id="quality"><option value="">默认</option><option value="low">低</option><option value="medium">中</option><option value="high">高</option></select></label>
      <label id="background-param">背景<select id="background"><option value="">默认</option><option value="auto">自动</option><option value="transparent">透明</option><option value="opaque">不透明</option></select></label>
      <label id="style-param">风格<select id="style"><option value="">默认</option><option value="vivid">鲜明</option><option value="natural">自然</option></select></label>
      <label id="n-param">数量<select id="n"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label>
    </div>
  </div>

  <div class="field">
    <label id="size-label">画幅</label>
    <div class="sizes" role="radiogroup" aria-labelledby="size-label">
      <button class="size on" data-size="1024x1024" role="radio" aria-checked="true">方</button>
      <button class="size" data-size="1536x1024" role="radio" aria-checked="false">横</button>
      <button class="size" data-size="1024x1536" role="radio" aria-checked="false">竖</button>
    </div>
  </div>

  <button id="go" class="go">开始生成<kbd>Ctrl ↵</kbd></button>
  <p id="msg" class="msg" role="alert"></p>
</aside>

<main class="wall">
  <div class="filters" id="filters">
    <input id="f-q" type="text" placeholder="搜索提示词…" spellcheck="false">
    <select id="f-model"><option value="">全部模型</option></select>
    <select id="f-provider"><option value="">全部来源</option></select>
    <select id="f-range">
      <option value="all">全部时间</option>
      <option value="today">今天</option>
      <option value="week">最近7天</option>
    </select>
    <select id="f-sort">
      <option value="newest">最新生成</option>
      <option value="fastest">最快生成</option>
      <option value="model">模型名称</option>
    </select>
  </div>
  <div id="gallery" class="masonry"></div>
  <div id="empty" class="empty">
    <div class="empty-mark">◌</div>
    <p>还没有照片。写一句提示词，按下开始。</p>
  </div>
  <nav id="pager" class="pager" hidden>
    <span id="pg-info" class="pg-info"></span>
    <span id="pg-controls" class="pg-controls">
      <button id="pg-first" class="pg-btn" title="第一页">«</button>
      <button id="pg-prev" class="pg-btn" title="上一页">‹</button>
      <span id="pg-nums" class="pg-nums"></span>
      <button id="pg-next" class="pg-btn" title="下一页">›</button>
      <button id="pg-last" class="pg-btn" title="最后一页">»</button>
      <span class="pg-jump">
        跳至 <input id="pg-input" type="number" min="1" value="1"> 页
        <button id="pg-go" class="pg-btn wide">前往</button>
      </span>
    </span>
  </nav>
</main>

<!-- 灯箱：滚轮/按钮缩放、拖拽平移、双击缩放 -->
<div id="lightbox" class="lightbox" hidden>
<figure class="frame">
  <div class="lb-body">
    <div class="stage">
      <img id="lb-img" alt="" draggable="false">
      <button id="lb-prev" class="lb-nav" aria-label="上一张">‹</button>
      <button id="lb-next" class="lb-nav" aria-label="下一张">›</button>
    </div>
    <aside class="lb-info">
      <h3>生成信息</h3>
      <dl class="lb-facts">
        <dt>模型</dt><dd id="lb-model">—</dd>
        <dt>API 来源</dt><dd id="lb-provider">—</dd>
        <dt>生成时间</dt><dd id="lb-time">—</dd>
        <dt>耗时</dt><dd id="lb-elapsed">—</dd>
        <dt>尺寸</dt><dd id="lb-size">—</dd>
        <dt>模式</dt><dd id="lb-mode">—</dd>
        <dt>线路</dt><dd id="lb-route">—</dd>
      </dl>
      <h3>Prompt</h3>
      <p id="lb-prompt" class="lb-prompt">—</p>
      <div class="lb-info-actions">
        <button id="lb-copy" class="zoom-btn wide">复制 Prompt</button>
        <button id="lb-reuse" class="zoom-btn wide">重新使用</button>
        <button id="lb-del" class="danger">删除</button>
      </div>
    </aside>
  </div>
  <figcaption class="bar">
    <span class="bar-left">
      <button class="zoom-btn" id="zoom-out" aria-label="缩小">−</button>
      <span id="zoom-level">100%</span>
      <button class="zoom-btn" id="zoom-in" aria-label="放大">+</button>
      <button class="zoom-btn wide" id="zoom-reset">适应</button>
    </span>
    <span id="lb-name"></span>
    <span class="bar-actions">
      <a id="lb-dl" download>下载原图</a>
      <button id="lb-close">关闭</button>
    </span>
  </figcaption>
</figure>
</div>

<!-- 设置 -->
<div id="settings" class="lightbox" hidden>
  <div class="frame settings-frame">
    <h2>设置</h2>

    <div class="set-field">
      <label for="set-name">名称</label>
      <div class="name-row">
        <input id="set-name" type="text" maxlength="12">
        <button id="name-save" class="ghost">保存</button>
      </div>
    </div>

    <div class="set-field">
      <label id="theme-label">主题 <span class="label-note">点击即换，自动保存</span></label>
      <div class="sizes themes" role="radiogroup" aria-labelledby="theme-label">
        <button class="size theme-btn" data-theme="darkroom">暮金</button>
        <button class="size theme-btn" data-theme="ink">黛夜</button>
        <button class="size theme-btn" data-theme="paper">宣纸</button>
      </div>
    </div>

    <div class="set-field">
      <label>API 中转站 <span class="label-note">点击「使用」切换，模型列表自动刷新</span></label>
      <div id="provider-list" class="provider-list"></div>
      <button id="provider-add" class="ghost prov-add">＋ 添加新的中转站</button>
    </div>

    <div class="set-field failover-setting">
      <label for="failover-toggle">线路容错</label>
      <label class="toggle-row"><input id="failover-toggle" type="checkbox"><span>生成失败时尝试备用中转站</span></label>
      <p class="label-note">仅在 429 / 502 / 503 / 504 或明确连接失败时切换一次；默认关闭。</p>
      <button id="health-refresh" class="ghost" type="button">重新检测</button>
    </div>

    <div id="provider-form" hidden>
      <div class="set-field">
        <label for="pf-name">中转站名称</label>
        <input id="pf-name" type="text" maxlength="20" placeholder="如：官方中转">
      </div>
      <div class="set-field">
        <label for="pf-base">API 地址</label>
        <input id="pf-base" type="text" spellcheck="false" placeholder="https://…">
      </div>
      <div class="set-field">
        <label for="pf-key">API 密钥</label>
        <input id="pf-key" type="password" spellcheck="false" autocomplete="off" placeholder="sk-…">
      </div>
      <div class="set-actions">
        <button id="pf-save" class="ghost solid">保存中转站</button>
        <button id="pf-test" class="ghost">测试连接</button>
        <button id="pf-cancel" class="ghost">取消</button>
      </div>
    </div>

    <div class="set-actions">
      <span id="set-msg" class="set-msg"></span>
    </div>

    <button id="set-close" class="set-close" aria-label="关闭设置">✕</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
